<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in | RoomQ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <a class="auth-brand" href="index.html" aria-label="RoomQ home">
        <img class="auth-logo" src="assets/roomq-classroom-orbit-logo.png" alt="RoomQ" />
      </a>

      <div class="auth-heading">
        <p class="panel-kicker">Welcome to RoomQ</p>
        <h1 id="authHeading">Sign in to your account</h1>
        <p id="authDescription">Choose your account type to continue.</p>
      </div>

      <div class="auth-role-switch" role="group" aria-label="Account type">
        <button type="button" class="auth-role-button" data-auth-role="user" aria-pressed="true">
          <span aria-hidden="true">♙</span> User
        </button>
        <button type="button" class="auth-role-button" data-auth-role="admin" aria-pressed="false">
          <span aria-hidden="true">▣</span> Admin
        </button>
      </div>

      <form class="auth-form" id="authForm">
        <label class="auth-field" for="authUsername">
          <span>Username</span>
          <input id="authUsername" name="username" type="text" autocomplete="username" minlength="3" maxlength="32" required />
        </label>

        <label class="auth-field" for="authPassword">
          <span>Password</span>
          <input id="authPassword" name="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" required />
        </label>

        <label class="auth-field" id="confirmPasswordField" for="authPasswordConfirm" hidden>
          <span>Confirm password</span>
          <input id="authPasswordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" />
        </label>

        <label class="auth-field" id="adminSetupKeyField" for="adminSetupKey" hidden>
          <span>Administrator setup key</span>
          <input id="adminSetupKey" name="setupKey" type="password" autocomplete="off" maxlength="256" />
        </label>

        <p class="auth-feedback" id="authFeedback" role="status" aria-live="polite"></p>
        <button class="auth-submit" id="authSubmit" type="submit">Sign in</button>
      </form>

      <button class="auth-mode-toggle" id="authModeToggle" type="button">
        New to RoomQ? <strong>Create a user account</strong>
      </button>
      <p class="auth-security-note" id="authSecurityNote">User accounts can reserve available classrooms. Schedule management is limited to administrators.</p>
      <a class="auth-back-link" href="classrooms.html">Continue browsing classrooms <span aria-hidden="true">→</span></a>
    </main>
    <script src="roomq-api.js"></script>
    <script src="login.js"></script>
  </body>
</html>
