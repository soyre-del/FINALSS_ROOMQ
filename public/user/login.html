<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in | RoomQ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../shared/css/roomq.css" />
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <div class="auth-card-top">
        <a class="auth-brand" href="dashboard.html" aria-label="RoomQ home">
          <img src="../assets/roomq-logo.webp" alt="RoomQ Logo" class="auth-logo-img" />
        </a>
      </div>

      <!-- Segmented Mode Switcher -->
      <div class="auth-tabs" role="tablist" aria-label="Account access mode">
        <button
          type="button"
          class="auth-tab is-active"
          id="authTabLogin"
          role="tab"
          aria-selected="true"
          data-auth-tab="login"
        >
          Sign In
        </button>
        <button
          type="button"
          class="auth-tab"
          id="authTabRegister"
          role="tab"
          aria-selected="false"
          data-auth-tab="register"
        >
          Create Account
        </button>
      </div>

      <div class="auth-heading">
        <h1 id="authHeading">Sign in to RoomQ</h1>
        <p id="authDescription">Enter your credentials to access your account.</p>
      </div>

      <form class="auth-form" id="authForm" novalidate>
        <div class="auth-field" id="firstNameField" hidden>
          <div class="auth-field-header">
            <label for="authFirstName">First Name</label>
          </div>
          <div class="auth-input-wrap">
            <i class="bi bi-person auth-input-icon" aria-hidden="true"></i>
            <input
              id="authFirstName"
              class="form-control auth-input"
              name="firstName"
              type="text"
              placeholder="Enter your first name"
              autocomplete="given-name"
              maxlength="60"
            />
          </div>
        </div>

        <div class="auth-field" id="middleNameField" hidden>
          <div class="auth-field-header">
            <label for="authMiddleName">Middle Name</label>
            <span class="auth-field-hint">Optional</span>
          </div>
          <div class="auth-input-wrap">
            <i class="bi bi-person auth-input-icon" aria-hidden="true"></i>
            <input
              id="authMiddleName"
              class="form-control auth-input"
              name="middleName"
              type="text"
              placeholder="Enter your middle name (optional)"
              autocomplete="additional-name"
              maxlength="60"
            />
          </div>
        </div>

        <div class="auth-field" id="lastNameField" hidden>
          <div class="auth-field-header">
            <label for="authLastName">Last Name</label>
          </div>
          <div class="auth-input-wrap">
            <i class="bi bi-person auth-input-icon" aria-hidden="true"></i>
            <input
              id="authLastName"
              class="form-control auth-input"
              name="lastName"
              type="text"
              placeholder="Enter your last name"
              autocomplete="family-name"
              maxlength="60"
            />
          </div>
        </div>

        <div class="auth-field">
          <div class="auth-field-header">
            <label for="authEmail">Email</label>
          </div>
          <div class="auth-input-wrap">
            <i class="bi bi-envelope auth-input-icon" aria-hidden="true"></i>
            <input
              id="authEmail"
              class="form-control auth-input"
              name="email"
              type="email"
              placeholder="Enter your email"
              autocomplete="email"
              maxlength="190"
              required
            />
          </div>
        </div>

        <div class="auth-field">
          <div class="auth-field-header">
            <label for="authPassword">Password</label>
            <span class="auth-field-hint" id="passwordHint" hidden>Min. 12 chars</span>
          </div>
          <div class="auth-input-wrap">
            <i class="bi bi-lock auth-input-icon" aria-hidden="true"></i>
            <input
              id="authPassword"
              class="form-control auth-input has-toggle"
              name="password"
              type="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              minlength="12"
              maxlength="128"
              required
            />
            <button
              type="button"
              class="auth-password-toggle"
              data-toggle-password="authPassword"
              aria-label="Show password"
              title="Show password"
            >
              <i class="bi bi-eye"></i>
            </button>
          </div>

          <div class="auth-strength-box" id="passwordStrengthBox" hidden>
            <div class="auth-strength-bars" aria-hidden="true">
              <span class="auth-strength-bar" data-strength-bar="1"></span>
              <span class="auth-strength-bar" data-strength-bar="2"></span>
              <span class="auth-strength-bar" data-strength-bar="3"></span>
              <span class="auth-strength-bar" data-strength-bar="4"></span>
            </div>
            <div class="auth-strength-meta">
              <span id="passwordStrengthLabel">At least 12 characters</span>
              <span class="auth-char-count" id="passwordCharCount">0 / 12</span>
            </div>
          </div>
        </div>

        <div class="auth-field" id="confirmPasswordField" hidden>
          <div class="auth-field-header">
            <label for="authPasswordConfirm">Confirm password</label>
            <span class="auth-match-pill" id="passwordMatchPill" hidden></span>
          </div>
          <div class="auth-input-wrap">
            <i class="bi bi-shield-check auth-input-icon" aria-hidden="true"></i>
            <input
              id="authPasswordConfirm"
              class="form-control auth-input has-toggle"
              name="passwordConfirm"
              type="password"
              placeholder="Re-enter your password"
              autocomplete="new-password"
              minlength="12"
              maxlength="128"
            />
            <button
              type="button"
              class="auth-password-toggle"
              data-toggle-password="authPasswordConfirm"
              aria-label="Show confirm password"
              title="Show password"
            >
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div class="auth-feedback" id="authFeedback" role="alert" aria-live="polite"></div>

        <button class="btn auth-submit" id="authSubmit" type="submit">
          <span class="auth-submit-label">Sign in</span>
          <i class="bi bi-arrow-right" aria-hidden="true"></i>
        </button>
      </form>

      <div class="auth-bottom">
        <button class="auth-mode-toggle" id="authModeToggle" type="button">
          New to RoomQ? <strong>Create an account</strong>
        </button>
        <a class="auth-back-link" href="dashboard.html">
          <i class="bi bi-arrow-left" aria-hidden="true"></i>
          <span>Back to Dashboard</span>
        </a>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../shared/js/roomq-api.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
