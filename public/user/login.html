<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in | RoomQ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../shared/css/roomq.css" />
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <a class="auth-brand" href="dashboard.html" aria-label="RoomQ home">
        <span class="brand-mark text-white"><i class="bi bi-buildings"></i></span>
        <span><span class="brand-name">RoomQ</span><span class="brand-sub text-muted">Classroom Management</span></span>
      </a>

      <div class="auth-heading">
        <p class="panel-kicker">Welcome to RoomQ</p>
        <h1 id="authHeading">Sign in to RoomQ</h1>
        <p id="authDescription">Use your administrator or user account to continue.</p>
      </div>

      <form class="auth-form" id="authForm">
        <label class="auth-field" for="authUsername">
          <span>Username</span>
          <input id="authUsername" class="form-control" name="username" type="text" autocomplete="username" minlength="3" maxlength="32" required />
        </label>

        <label class="auth-field" for="authPassword">
          <span>Password</span>
          <input id="authPassword" class="form-control" name="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" required />
        </label>

        <label class="auth-field" id="confirmPasswordField" for="authPasswordConfirm" hidden>
          <span>Confirm password</span>
          <input id="authPasswordConfirm" class="form-control" name="passwordConfirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" />
        </label>

        <p class="auth-feedback" id="authFeedback" role="status" aria-live="polite"></p>
        <button class="btn btn-primary auth-submit" id="authSubmit" type="submit">Sign in</button>
      </form>

      <button class="auth-mode-toggle" id="authModeToggle" type="button">
        New to RoomQ? <strong>Create an account</strong>
      </button>
      <p class="auth-security-note" id="authSecurityNote">User accounts can reserve available classrooms. Schedule management is limited to administrators.</p>
      <a class="auth-back-link" href="classrooms.html">Continue browsing classrooms <span aria-hidden="true">→</span></a>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../shared/js/roomq-api.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
